ipo.dashboard:
  path: '/ipo'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoController::dashboard'
    _title: 'IPO Practice Dashboard'
  requirements:
    _permission: 'access ipo dashboard'

ipo.secure:
  path: '/ipo/secure'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoController::secure'
    _title: 'Secure IPO page'
  requirements:
    _custom_access: '\Drupal\ipo\Access\IpoAccessCheck::access'

ipo.form:
  path: '/ipo/form'
  defaults:
    _form: '\Drupal\ipo\Form\IpoForm'
    _title: 'IPO Form'
  requirements:
    _permission: 'administer ipo settings'

ipo.ajax:
  path: '/ipo/ajax'
  defaults:
    _form: '\Drupal\ipo\Form\IpoAjaxForm'
    _title: 'IPO AJAX Form'
  requirements:
    _permission: 'administer ipo settings'

ipo.batch:
  path: '/ipo/batch'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoBatchController::run'
    _title: 'IPO Batch'
  requirements:
    _permission: 'administer ipo settings'

ipo.IpoFormForQueueExample:
  path: '/ipo/apply'
  defaults:
    _form: '\Drupal\ipo\Form\IpoFormForQueueExample'
    _title: 'IPO Form for Queue Example'
  requirements:
    _permission: 'access content'

ipo.session_operations:
  path: '/ipo/session'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoSessionController::sessionOperations'
    _title: 'IPO Session Operations'
  requirements:
    _permission: 'access content'

ipo.cookie_operations:
  path: '/ipo/cookie'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoCookieController::cookieOperations'
    _title: 'IPO Cookie Operations'
  requirements:
    _permission: 'access content'

ipo.state:
  path: '/ipo/state'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoStateController::state'
    _title: 'IPO State API'
  requirements:
    _permission: 'access content'

ipo.state_update:
  path: '/ipo/state/update'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoStateController::updateState'
    _title: 'Update IPO State'
  requirements:
    _permission: 'access content'

ipo.state_delete:
  path: '/ipo/state/delete'
  defaults:
    _controller: '\Drupal\ipo\Controller\IpoStateController::deleteState'
    _title: 'Delete IPO State'
  requirements:
    _permission: 'access content'

ipo.sdc:
  path: '/sdc-test'
  defaults:
    _controller: '\Drupal\ipo\Controller\SdcTestController::test'
    _title: 'Paisa SDC Test'
  requirements:
    _permission: 'access content'

